name: CI — Lint & Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.lambda }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lambda:
          - pb-to-ghl
          - ghl-webhook
          - ddb-to-pb
          - retry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: src/lambda/${{ matrix.lambda }}
        run: npm install

      - name: Run linter
        working-directory: src/lambda/${{ matrix.lambda }}
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run unit tests
        working-directory: src/lambda/${{ matrix.lambda }}
        # --passWithNoTests prevents failure when no test files exist yet.
        # Remove this flag once real test files are added.
        run: npx jest --passWithNoTests --coverage